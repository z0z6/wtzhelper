<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:;">
  <title>WTZ Helper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="window">
    <header class="titlebar">
      <div class="titlebar-left"></div>
      <div class="titlebar-title" id="window-title">WTZ Helper</div>
      <div class="titlebar-right">
        <div class="traffic" id="traffic">
          <button class="tl min" data-act="minimize" title="Minimalizuj"><svg viewBox="0 0 10 10"><path d="M2.5 5h5"/></svg></button>
          <button class="tl max" data-act="maximize" title="Maksymalizuj"><svg viewBox="0 0 10 10"><path d="M3 6.8V3h3.8zM7 3.2V7H3.2z"/></svg></button>
          <button class="tl close" data-act="close" title="Zamknij"><svg viewBox="0 0 10 10"><path d="M3 3l4 4M7 3L3 7"/></svg></button>
        </div>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content" id="content"></main>
    </div>
  </div>
  <div id="sheet-root"></div>
  <div id="toast-root"></div>
  <script src="vendor/tesseract/tesseract.min.js"></script>
  <script src="icons.js"></script>
  <script src="ui.js"></script>
  <script src="ocr.js"></script>
  <script src="account.js"></script>
  <script src="docs.js"></script>
  <script src="app.js"></script>
</body>
</html>
